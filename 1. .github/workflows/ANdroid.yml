name: Compilare APK Flota
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Deschide codul sursa
        uses: actions/checkout@v4

      - name: Instaleaza Java 2026
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instaleaza Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Aliniaza folderul de cod
        run: |
          TARGET_DIR=$(find . -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          if [ -n "$TARGET_DIR" ] && [ "$TARGET_DIR" != "." ]; then
            echo "Am gasit codul in $TARGET_DIR. Il mutam..."
            mv "$TARGET_DIR"/* . || true
            mv "$TARGET_DIR"/.* . || true
          fi

      - name: Descarca Librarii
        run: flutter pub get

      - name: Construieste APK Compact
        run: flutter build apk --release --split-per-abi

      - name: Salveaza Fisierul pentru Telefon
        uses: actions/upload-artifact@v4
        with:
          name: aplicatie-santax
          path: build/app/outputs/flutter-apk/*-release.apk
