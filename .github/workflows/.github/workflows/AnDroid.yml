name: Compilare APK Flota
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Deschide codul sursa
        uses: actions/checkout@v4

      - name: Instaleaza Java Nou (Node 24)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instaleaza Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Descarca Librarii
        run: |
          if [ -d "evidenta_auto_v1" ]; then
            cd evidenta_auto_v1
          fi
          flutter pub get

      - name: Construieste APK Compact
        run: |
          if [ -d "evidenta_auto_v1" ]; then
            cd evidenta_auto_v1
          fi
          flutter build apk --release --split-per-abi

      - name: Salveaza Fisierul pentru Telefon
        uses: actions/upload-artifact@v4
        with:
          name: aplicatie-santax
          path: |
            build/app/outputs/flutter-apk/*-armeabi-v7a-release.apk
            evidenta_auto_v1/build/app/outputs/flutter-apk/*-armeabi-v7a-release.apk
